<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GiftShelf.co.uk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/src/assets/style.css" rel="stylesheet" />
    <link href="/src/assets/shop-theme.css" rel="stylesheet" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <header class="mint-green">
      <div class="px-3 py-2">
        <div class="container">
          <div
            class="d-flex flex-wrap align-items-center justify-content-lg-start"
          >
            <a
              href="/"
              class="d-flex my-2 my-lg-0 me-lg-auto text-white text-decoration-none"
            >
              <img
                id="header-logo"
                src="/src/assets/GiftShelf.svg"
                class="w-100"
                alt="GiftShelf"
                style="cursor: pointer"
              />
            </a>
          </div>
        </div>
      </div>
      <div class="px-3 py-2 border-bottom mb-3">
        <div class="container d-flex flex-wrap justify-content-center p-0">
          <form class="mb-2 mb-lg-0 me-auto" role="search">
            <input
              type="search"
              class="form-control header-search"
              placeholder="Search..."
              aria-label="Search"
            />
          </form>
          <div class="text-end">
            <button type="button" class="btn btn-header p-0">
              <img
                id="filter-btn"
                src="/src/assets/icons/filters.svg"
                class="p-0"
                alt="Filter"
                style="cursor: pointer"
              />
            </button>
            <button type="button" class="btn btn-header p-0">
              <img
                id="sort-btn"
                src="/src/assets/icons/sort.svg"
                class="p-0"
                alt="Sort"
                style="cursor: pointer"
              />
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="container py-1">
      <div class="row">
        <div id="app"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
